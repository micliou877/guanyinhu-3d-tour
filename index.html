<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>建築外觀 3D 模型</title>
<style>
  :root {
    --ui-bg: rgba(255, 255, 255, 0.92);
    --ui-fg: #1f2937;
    --ui-accent: #2563eb;
    --ui-border: rgba(0, 0, 0, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #eef2f6;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ui-fg);
  }
  #app { position: fixed; inset: 0; }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: max(10px, env(safe-area-inset-top)) 14px 10px 14px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0));
    pointer-events: none;
    z-index: 10;
  }
  #topbar h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    color: var(--ui-fg);
    text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  #fullscreen-btn {
    pointer-events: auto;
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  #loading {
    position: absolute; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #eef2f6;
    gap: 16px;
    transition: opacity 0.4s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .logo {
    font-size: 15px; font-weight: 600; color: var(--ui-fg); letter-spacing: 0.5px;
  }
  #progress-track {
    width: min(280px, 70vw); height: 8px; border-radius: 999px;
    background: rgba(0,0,0,0.08); overflow: hidden;
  }
  #progress-fill {
    height: 100%; width: 0%; border-radius: 999px;
    background: var(--ui-accent);
    transition: width 0.15s ease;
  }
  #progress-text { font-size: 13px; color: #6b7280; }
  #loading-error {
    display: none; color: #b91c1c; font-size: 13px; text-align: center; max-width: 80vw;
  }

  #bottombar {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 10px;
    padding: 10px 14px max(14px, env(safe-area-inset-bottom)) 14px;
    background: linear-gradient(to top, rgba(255,255,255,0.85), rgba(255,255,255,0));
    z-index: 10;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btn {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 999px;
    background: var(--ui-bg); border: 1px solid var(--ui-border);
    color: var(--ui-fg); font-size: 13px; font-weight: 500;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    -webkit-user-select: none; user-select: none;
  }
  .btn:active { background: #f3f4f6; transform: scale(0.97); }
  .btn.active { background: var(--ui-accent); color: white; border-color: var(--ui-accent); }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

  #hint {
    position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: white; font-size: 12px;
    padding: 6px 12px; border-radius: 999px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
    z-index: 10;
  }
  #hint.show { opacity: 1; }

  @media (orientation: landscape) and (max-height: 500px) {
    #topbar h1 { display: none; }
    .btn { padding: 8px 12px; font-size: 12px; }
    #bottombar { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap"></div>

  <div id="topbar">
    <h1>建築外觀 3D 檢視</h1>
    <button id="fullscreen-btn" title="全螢幕">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>

  <div id="hint">單指旋轉・雙指縮放/平移・雙擊重設視角</div>

  <div id="bottombar">
    <div class="row" id="preset-row">
      <button class="btn" data-preset="road">道路側</button>
      <button class="btn" data-preset="river">河岸側</button>
      <button class="btn" data-preset="aerial">鳥瞰</button>
    </div>
    <div class="row">
      <button class="btn" id="autorotate-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3.4-7.1M21 3v5h-5"/></svg>
        自動旋轉
      </button>
      <button class="btn" id="reset-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 3v6h6"/></svg>
        重設視角
      </button>
    </div>
  </div>

  <div id="loading">
    <div class="logo">正在載入 3D 模型</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="progress-text">0%</div>
    <div id="loading-error"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/jsm/",
    "@sparkjsdev/spark": "./vendor/spark.module.js"
  }
}
</script>
<script type="module" src="./viewer.js"></script>
</body>
</html>
